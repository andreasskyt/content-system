<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=420">
<title>BRAND Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-primary: #303b2f;
    --brand-primary-light: #4C564A;
    --brand-primary-dark: #161B15;
    --brand-accent-gold: #BCAC8B;
    --brand-light-bg: #F5F1EA;
    --brand-light-border: #E8E1D3;
    --brand-text-dark: #1A1918;
    --brand-text-muted: #8A8580;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', system-ui, sans-serif;
    background: #f3f3f1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }

  .sans { font-family: 'Poppins', system-ui, sans-serif; }

  /* IG preview frame — 420px fixed */
  .ig-frame {
    width: 420px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    overflow: hidden;
  }

  .ig-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #eee;
  }

  .carousel-viewport {
    position: relative;
    width: 420px;
    height: 525px;
    overflow: hidden;
  }

  .carousel-track {
    display: flex;
    height: 100%;
    transition: transform 0.35s ease;
  }

  .slide {
    width: 420px;
    height: 525px;
    flex-shrink: 0;
    position: relative;
    padding: 0 36px 52px;
    display: flex;
    flex-direction: column;
  }

  /* Three surfaces only: beige, white, brand gradient. No black. No tags. */
  .slide.light { background: var(--brand-light-bg); color: var(--brand-text-dark); }
  .slide.white { background: #ffffff;              color: var(--brand-text-dark); }
  .slide.gradient {
    background: linear-gradient(165deg, #161B15 0%, #303b2f 50%, #4C564A 100%);
    color: #fff;
  }

  .slide.center { justify-content: center; }
  .slide.end    { justify-content: flex-end; }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.4px;
    line-height: 1.15;
    margin: 0;
  }

  p, .body { font-size: 14px; line-height: 1.55; margin: 0; }

  .progress {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 16px 28px 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-track { flex: 1; height: 3px; border-radius: 2px; overflow: hidden; }
  .progress-fill  { height: 100%; border-radius: 2px; }
  .slide.light .progress-track,
  .slide.white .progress-track    { background: rgba(0,0,0,0.08); }
  .slide.light .progress-fill,
  .slide.white .progress-fill     { background: var(--brand-primary); }
  .slide.light .progress-counter,
  .slide.white .progress-counter  { color: rgba(0,0,0,0.3); }
  .slide.gradient .progress-track { background: rgba(255,255,255,0.18); }
  .slide.gradient .progress-fill  { background: #fff; }
  .slide.gradient .progress-counter { color: rgba(255,255,255,0.5); }
  .progress-counter { font-size: 11px; font-weight: 500; }

  .swipe-arrow {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 48px; z-index: 9;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .slide.light .swipe-arrow,
  .slide.white .swipe-arrow    { background: linear-gradient(to right, transparent, rgba(0,0,0,0.06)); }
  .slide.gradient .swipe-arrow { background: linear-gradient(to right, transparent, rgba(255,255,255,0.08)); }

  .lockup {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .lockup .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .lockup .name {
    font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  }
  .slide.light .lockup .name    { color: var(--brand-text-dark); }
  .slide.white .lockup .name    { color: var(--brand-primary); }
  .slide.gradient .lockup .name { color: #fff; }

  /* White-slide text overrides — dark green main, warm muted sub. Never near-black. */
  .slide.white h1 { color: var(--brand-primary); }

  /* Hand-drawn underline — always red, grainy edge, single-bow pen stroke. One class: .hl
     Text color inherits from the surface's emphasis color (green on beige/white, gold on gradient). */
  .hl {
    display: inline-block;
    position: relative;
    padding-bottom: 2px;
  }
  .slide.light .hl, .slide.white .hl { color: var(--brand-primary); }
  .slide.gradient .hl                { color: var(--brand-accent-gold); }
  .hl::after {
    content: "";
    position: absolute;
    left: -3px; right: -3px; bottom: -6px;
    height: 9px;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 9' preserveAspectRatio='none'><defs><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='2' seed='7'/><feDisplacementMap in='SourceGraphic' scale='1.2'/></filter></defs><path d='M3,6 Q60,3.3 117,6' stroke='%23C8102E' stroke-width='2.4' stroke-linecap='round' fill='none' filter='url(%23g)'/></svg>");
  }
</style>
</head>
<body>

<div class="ig-frame">

  <!-- Header -->
  <div class="ig-header">
    <img src="profile.png" alt="[BRAND_SLUG]" style="width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;">
    <div>
      <div style="font-size:13px;font-weight:600;color:#222;">[BRAND_SLUG]</div>
      <div style="font-size:11px;color:#888;">Brand</div>
    </div>
  </div>

  <!-- Carousel viewport -->
  <div class="carousel-viewport">
    <div class="carousel-track">

      <!-- SLIDE 1 — hero (gradient). Always gradient for slide 1. Gold highlight with hand-drawn underline. -->
      <div class="slide gradient center">
        <div class="lockup" style="margin-bottom:20px;">
          <img class="avatar" src="profile.png" alt="[BRAND_SLUG]">
          <div class="name">BRAND</div>
        </div>
        <h1 style="color:#fff;">Stop hiring editors.<br>Start shipping <span class="hl">systems</span>.</h1>
        <div class="progress">
          <div class="progress-track"><div class="progress-fill" style="width:14.2%;"></div></div>
          <span class="progress-counter">1/7</span>
        </div>
        <div class="swipe-arrow">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- SLIDE 2 — problem (beige). Dark-grey body text (--brand-text-dark), green highlight with underline. -->
      <div class="slide light center">
        <h1>£1,500/mo for an editor who ghosts by month 3.</h1>
        <p class="sans" style="margin-top:16px;color:var(--brand-text-muted);font-size:14px;line-height:1.55;">Hire. Pay. Babysit. Replace. Repeat.</p>
        <p class="sans" style="margin-top:16px;color:var(--brand-primary);font-size:15px;font-weight:600;line-height:1.4;">That's not a hire. That's a <span class="hl">loop</span>.</p>
        <div class="progress">
          <div class="progress-track"><div class="progress-fill" style="width:28.5%;"></div></div>
          <span class="progress-counter">2/7</span>
        </div>
        <div class="swipe-arrow">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="rgba(0,0,0,0.25)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- Add more slides (3-7) here. Surface arc: start gradient (slide 1), then cycle beige → gradient → white → beige → gradient.
           Never two beige or two white in a row. Slide 1 always gradient. See brand.md "Visual rhythm rule". -->
      <!-- Highlight rules: green underline (.hl-green) on beige/white; gold underline (.hl-gold) on gradient. One highlight per slide. -->
      <!-- White-slide text: h1 and titles auto-colored dark green via CSS; sub-text in --brand-text-muted. Never use --brand-text-dark on .slide.white. -->

    </div>
  </div>

  <!-- Dots -->
  <div class="ig-dots" style="display:flex;justify-content:center;gap:4px;padding:8px 0;">
    <!-- one dot per slide — active = var(--brand-primary), inactive = #ccc -->
  </div>

  <!-- Actions -->
  <div class="ig-actions" style="display:flex;gap:14px;padding:8px 14px;">
    <!-- heart, comment, share, bookmark SVGs -->
  </div>

  <!-- Caption -->
  <div class="ig-caption" style="padding:4px 14px 14px;font-size:13px;color:#222;line-height:1.4;">
    <b>[BRAND_SLUG]</b> built this so i could stop doing it by hand. swipe for the system →
    <div style="color:#999;font-size:10px;margin-top:6px;text-transform:uppercase;letter-spacing:0.5px;">2 hours ago</div>
  </div>
</div>

<!-- Navigation: click left-third=prev, right=next; arrow keys; dot click; touch swipe.
     The export script ignores this — it sets track transforms directly via page.evaluate(). -->
<script>
(function() {
  const track = document.querySelector('.carousel-track');
  const viewport = document.querySelector('.carousel-viewport');
  const slides = document.querySelectorAll('.carousel-track .slide');
  const dots = document.querySelectorAll('.ig-dots span');
  const TOTAL = slides.length;
  const SLIDE_W = 420;
  let idx = 0;
  function go(n) {
    idx = Math.max(0, Math.min(TOTAL - 1, n));
    track.style.transform = 'translateX(' + (-idx * SLIDE_W) + 'px)';
    dots.forEach((d, i) => d.style.background = i === idx ? '#303b2f' : '#ccc');
  }
  viewport.addEventListener('click', (e) => {
    const rect = viewport.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width * 0.3) go(idx - 1); else go(idx + 1);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(idx + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
  });
  dots.forEach((d, i) => {
    d.style.cursor = 'pointer';
    d.addEventListener('click', (e) => { e.stopPropagation(); go(i); });
  });
  let touchStartX = 0;
  viewport.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
  viewport.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
  });
})();
</script>

</body>
</html>
